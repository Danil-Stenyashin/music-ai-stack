version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: music_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - music_network

  redis:
    image: redis:7-alpine
    container_name: music_redis_queue
    networks:
      - music_network

  backend:
    build: ./backend
    container_name: music_api_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/music_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - music_network

  worker:
    build: ./worker
    container_name: music_ai_worker
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/music_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - music_network

  frontend:
    build: ./frontend
    container_name: music_web_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - music_network

volumes:
  pg_data:

networks:
  music_network:
    driver: bridge